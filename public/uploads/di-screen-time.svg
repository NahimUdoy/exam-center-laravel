<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Average daily screen time by age group">
  <rect width="640" height="400" fill="#fff7ed"/>
  <text x="40" y="42" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#9a3412">Average daily screen time by age group (hours)</text>
  <rect x="80" y="80" width="72" height="220" rx="8" fill="#f97316"/>
  <rect x="200" y="50" width="72" height="250" rx="8" fill="#ea580c"/>
  <rect x="320" y="110" width="72" height="190" rx="8" fill="#f59e0b"/>
  <rect x="440" y="160" width="72" height="140" rx="8" fill="#fb923c"/>
  <line x1="60" y1="310" x2="580" y2="310" stroke="#9a3412" stroke-width="2" opacity="0.35"/>
  <text x="92" y="338" font-family="system-ui,sans-serif" font-size="13" fill="#7c2d12">1017</text>
  <text x="212" y="338" font-family="system-ui,sans-serif" font-size="13" fill="#7c2d12">1829</text>
  <text x="332" y="338" font-family="system-ui,sans-serif" font-size="13" fill="#7c2d12">3044</text>
  <text x="460" y="338" font-family="system-ui,sans-serif" font-size="13" fill="#7c2d12">45+</text>
  <text x="116" y="72" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#9a3412">6.1</text>
  <text x="236" y="42" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#9a3412">7.4</text>
  <text x="352" y="102" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#9a3412">5.2</text>
  <text x="472" y="152" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#9a3412">3.8</text>
</svg>
